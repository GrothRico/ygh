---
- name: Bootstrap a fresh YGH VPS platform
  hosts: bootstrap
  become: true
  gather_facts: true

  pre_tasks:
    - name: Require Ubuntu 26.04 LTS on amd64
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version("26.04", "==")
          - ansible_architecture == "x86_64"
        fail_msg: This playbook supports only Ubuntu 26.04 LTS amd64.

    - name: Read installed packages before changing the host
      ansible.builtin.package_facts:
        manager: auto

    - name: Refuse to replace an existing container runtime
      ansible.builtin.assert:
        that:
          - >-
            ansible_facts.packages.keys() | intersect([
              'docker.io', 'docker-compose', 'docker-compose-v2', 'docker-doc',
              'podman-docker', 'containerd', 'runc', 'docker-buildx'
            ]) | length == 0
        fail_msg: >-
          A container runtime package is already installed. Bootstrap is limited to
          a fresh host and will not remove or replace existing runtime packages.

  tasks:
    - name: Install packages needed for the Docker repository
      ansible.builtin.apt:
        name: [ca-certificates, curl]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the Docker apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the Docker repository signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: Configure the official Docker apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: Install Docker Engine, Compose plugin, and UFW
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - ufw
          - sudo
        state: present
        update_cache: true

    - name: Ensure Docker is enabled and running
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Confirm Docker Engine is at least version 28
      ansible.builtin.command:
        argv:
          - docker
          - version
          - --format
          - "{{ '{{' }}.Server.Version{{ '}}' }}"
      register: docker_server_version
      changed_when: false
      failed_when: >-
        docker_server_version.rc != 0 or
        docker_server_version.stdout is not version("28.0", ">=")

    - name: Create the deployment account with Docker and sudo access
      ansible.builtin.user:
        name: "{{ ygh_deploy_user }}"
        comment: YGH deployment account
        shell: /bin/bash
        groups: [sudo, docker]
        append: true
        create_home: true
        password_lock: true
        state: present

    - name: Allow passwordless sudo for the Tailscale SSH deployment account
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ygh-deploy
        content: "{{ ygh_deploy_user }} ALL=(ALL:ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    - name: Create the persistent YGH host directory
      ansible.builtin.file:
        path: "{{ ygh_persistent_root }}"
        state: directory
        owner: root
        group: "{{ ygh_deploy_user }}"
        mode: "0750"

    - name: Report the intentionally incomplete network boundary
      ansible.builtin.debug:
        msg: >-
          Bootstrap complete. No firewall state was changed; the host is not ready
          for private operation until finalize-firewall.yml succeeds over Tailscale SSH.
