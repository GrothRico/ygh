name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Node tests
        run: npm test -- --exclude scripts/backup-runner.test.ts

      - name: Backup host-runner tests
        run: sudo env "PATH=$PATH" CI=true npm test -- scripts/backup-runner.test.ts

      - name: Python tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_p112_*.py' -v
          python3 -m unittest discover -s infra/ansible/files -p 'test_verify_tailscale_serve.py' -v

      - name: Production build
        run: npm run build
